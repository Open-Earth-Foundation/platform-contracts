name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint OpenAPI snapshot and validate event examples
        run: npm test

      - name: Guard against breaking changes to the previous release
        if: github.event_name == 'pull_request'
        env:
          OASDIFF_VERSION: "1.34.1"
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "origin/${{ github.base_ref }}" 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release tag; skipping."
            exit 0
          fi
          curl -fsSL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin oasdiff
          git show "$PREV_TAG:openapi/v1/citycatalyst-api.json" > /tmp/prev.json
          node scripts/strip-internal.mjs /tmp/prev.json /tmp/base.json
          node scripts/strip-internal.mjs openapi/v1/citycatalyst-api.json /tmp/revision.json
          oasdiff breaking /tmp/base.json /tmp/revision.json --fail-on ERR
